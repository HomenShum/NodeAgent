name: NodeAgent CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Verify the walkthrough render pipeline end-to-end in a temp dir.
      # ffmpeg output (x264/GIF palette) is not byte-deterministic across
      # builds, so CI must not re-render over the committed media and expect
      # byte-identity; the git-diff guard below now only catches unintended
      # mutations of docs/walkthroughs during the run.
      - run: npm run walkthroughs:check
      - run: npm run omnigent:official:probe
      - run: npm run prepush
      - run: git diff --exit-code -- docs/walkthroughs
